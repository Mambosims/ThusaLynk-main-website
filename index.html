    <style>
      :root {
        --accent: #94a3b8;
        --bg: #050505;
        --text: #ffffff;
        --card-bg: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
      }
      
      .light {
        --bg: #ffffff;
        --text: #020617;
        --card-bg: rgba(255, 255, 255, 0.7);
        --border: rgba(15, 23, 42, 0.12);
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      .modern-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: var(--bg);
        background-image: 
          radial-gradient(at 0% 0%, rgba(148, 163, 184, 0.12) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(148, 163, 184, 0.08) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(148, 163, 184, 0.04) 0px, transparent 50%);
      }

      .light .modern-bg {
        background-image: 
          radial-gradient(at 0% 0%, rgba(148, 163, 184, 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(147, 51, 234, 0.04) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(148, 163, 184, 0.04) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(148, 163, 184, 0.02) 0px, transparent 50%);
      }

      .font-display {
        letter-spacing: -0.04em;
      }
      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.05);
      }
      .light .glass-card {
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
      }
      .outline-text {
        -webkit-text-stroke: 1px currentColor;
        color: currentColor;
        fill: currentColor;
        opacity: 0.5;
      }
      .light .outline-text {
        opacity: 0.4;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .reveal {
        animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
